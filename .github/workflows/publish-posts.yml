# Publisher dei post: branch `posts` (scritta dal task ChatGPT) → Supabase → build Vercel di main.
#
# Questo file vive nella branch `posts` (dove GitHub lo esegue a ogni push) e in main come riferimento.
# Il codice del publisher è sempre preso da main: la branch posts contiene solo i JSON e questo workflow.
# Vercel non costruisce la branch posts (vercel.json); la build di produzione parte dal deploy hook
# solo se almeno un post è stato pubblicato, quindi nessun ciclo commit → build → commit.
#
# Secret richiesti nel repository: TCS_SUPABASE_URL, TCS_SUPABASE_SECRET_KEY, VERCEL_DEPLOY_HOOK_URL.
# In caso di errore apre una issue con GITHUB_TOKEN (issues: write); vedi anche daily-post-check.yml.
# Ogni modifica di questo file va copiata anche nella branch posts, da cui GitHub lo esegue.
#
# Ripubblicare un giorno già online (es. risultati aggiunti in coda): aggiornare posts/YYYY-MM-DD.json con un
# commit il cui messaggio contiene "[skip ci]", poi avviare a mano questo workflow con republish_date=YYYY-MM-DD.
# Il publisher valida il file e sostituisce il briefing in una transazione (RPC republish_briefing).

name: Publish posts

on:
  push:
    branches: [posts]
    paths: ['posts/**.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only, do not write to Supabase
        type: boolean
        default: false
      republish_date:
        description: Replace the already published briefing of this date (YYYY-MM-DD) with its current file
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publisher (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout posts
        uses: actions/checkout@v4
        with:
          ref: posts
          path: content

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Publish to Supabase
        id: publish
        working-directory: app
        env:
          TCS_SUPABASE_URL: ${{ secrets.TCS_SUPABASE_URL }}
          TCS_SUPABASE_SECRET_KEY: ${{ secrets.TCS_SUPABASE_SECRET_KEY }}
          # Input passato come variabile d'ambiente, mai interpolato nello script; il formato lo valida il publisher.
          REPUBLISH_DATE: ${{ inputs.republish_date }}
        run: |
          set -o pipefail
          node scripts/publish-posts.ts ${{ inputs.dry_run && '--dry-run' || '' }} ${REPUBLISH_DATE:+"--republish=$REPUBLISH_DATE"} ../content/posts 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # Anche se un altro post è fallito, quelli pubblicati devono comparire sul sito.
      - name: Trigger Vercel production build
        if: ${{ always() && steps.publish.outputs.published != '' && steps.publish.outputs.published != '0' }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        # Il hook ha superato i 30 s due volte (issue #16, #18): attesa più lunga e tentativi ripetuti.
        run: |
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 90 -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null; then
              exit 0
            fi
            echo "Deploy hook attempt $attempt failed"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 30))
          done
          exit 1

      # Avviso: una issue per ogni run fallito (notifica email/app al proprietario), con gli errori del publisher.
      # Il publisher non stampa mai chiavi; il log contiene solo percorsi, date ed errori di validazione.
      - name: Open an issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          errors=$(grep -E '^ERRORE|^  ' "$RUNNER_TEMP/publish.log" 2>/dev/null | head -40 || true)
          [ -n "$errors" ] || errors='No publisher output: the failure happened before or after the publish step.'
          # Assegnazione e menzione del proprietario: notifiche "participating", anche via email.
          owner='${{ github.repository_owner }}'
          body=$(printf '@%s The publish workflow failed, so new posts may not be online.\n\nRun: %s\n\n```\n%s\n```\n\nOpened automatically by the "Publish posts" workflow.' "$owner" "$RUN_URL" "$errors")
          gh issue create -R "${{ github.repository }}" --title "Publish failed ($(TZ=Europe/Rome date +%F), run ${{ github.run_id }})" --body "$body" --assignee "$owner"
